apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-deployment
  namespace: tp5
  labels:
    app: echo
  annotations:
    kubernetes.io/change-cause: "init recreat version"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo


  strategy:
    type: Recreate
  
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo-http
        image: hashicorp/http-echo:1.0
        ports:
          - name: http
            containerPort: 5678
        args:
          - "-text=HELP me im stuck in k8s"