apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: echo-http
  labels:
    app: echo-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo-rs
  template:
    metadata:
      labels:
        app: echo-rs
    spec:
      containers:
        - name: http
          image: hashicorp/http-echo:1.0
          args:
            - "-text=Yoooo from k8s cluster :)"
          ports:
            - containerPort: 5678
              name: http
