apiVersion: v1
kind: Pod
metadata:
  name: boutique-front
  namespace: dev
  labels:
    app: boutique
    tier: frontend
    env: dev
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80

  
