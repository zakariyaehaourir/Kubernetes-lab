apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2-ingress
  namespace: ingress-lab
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  ingressClassName: nginx
  rules:
    - host: "zakariyae.test"
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: service-app1
                port:
                  number: 80
          - path: /api/v2
            pathType: Prefix
            backend:
              service:
                name: service-app2
                port:
                  number: 80
---
