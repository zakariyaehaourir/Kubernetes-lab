---
- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    owner: root
    group: root
    mode: "0644"

- name: Convert Kubernetes signing key to GPG format
  ansible.builtin.command:
    cmd: >-
      gpg --dearmor --yes
      -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /tmp/kubernetes-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Configure Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /
    filename: kubernetes
    state: present
    update_cache: true

- name: Install kubeadm and kubelet
  ansible.builtin.apt:
    name:
      - kubeadm
      - kubelet
    state: present
    update_cache: true

- name: Prevent automatic Kubernetes package upgrades
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet

- name: Enable kubelet service
  ansible.builtin.service:
    name: kubelet
    enabled: true
