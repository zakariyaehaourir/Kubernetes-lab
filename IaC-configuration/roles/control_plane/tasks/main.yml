# tasks file for roles/control_plan

---
- name: Install kubectl
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true

- name: Hold kubectl package version
  ansible.builtin.dpkg_selections:
    name: kubectl
    selection: hold

- name: Check containerd service
  ansible.builtin.service_facts:

- name: Ensure containerd is running
  ansible.builtin.assert:
    that:
      - "'containerd.service' in ansible_facts.services"
      - "ansible_facts.services['containerd.service'].state == 'running'"
    fail_msg: "containerd must be running before initializing Kubernetes."
    
- name: Get installed kubeadm version
  ansible.builtin.command:
    argv:
      - kubeadm
      - version
      - -o
      - short
  register: kubeadm_version
  changed_when: false

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - "--kubernetes-version={{ kubeadm_version.stdout }}"
      - "--apiserver-advertise-address={{ control_plane_private_ip }}"
      - "--pod-network-cidr={{ pod_network_cidr }}"
      - "--cri-socket=unix:///run/containerd/containerd.sock"
    creates: /etc/kubernetes/admin.conf

- name: Test Kubectl is working
  ansible.builtin.command: kubectl version --client
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubectl_check
  failed_when: false
  changed_when: false


- name: Ensue Kubectl is working in the cluster
  ansible.builtin.assert:
    that:
      - kubectl_check.rc == 0

    fail_msg: "Kubectl is not wokring withing cluster"
    success_msg: "Kubectl is working properly and can reach the cluster !"

- name: Deploy service metrics
  ansible.builtin.command: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf


- name: Patching Metrics server adding tls fail_msg
  ansible.builtin.command: >
    kubectl patch deployment metrics-server -n kube-system --type='json'
    -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
