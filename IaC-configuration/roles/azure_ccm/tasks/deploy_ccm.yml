---
- name: Deploy Azure Cloud Controller Manager
  become: true
  delegate_to: control-plane
  run_once: true
  block:

    - name: Generate CCM Deployment manifest
      ansible.builtin.template:
        src: deployment.yaml.j2
        dest: /tmp/azure-ccm-deployment.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Apply CCM Deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - /tmp/azure-ccm-deployment.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: ccm_deployment
      changed_when: "'created' in ccm_deployment.stdout or 'configured' in ccm_deployment.stdout"

    - name: Remove temporary manifest
      ansible.builtin.file:
        path: /tmp/azure-ccm-deployment.yaml
        state: absent